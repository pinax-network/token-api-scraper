# bunfig.toml

# Runs before `bun ./file.ts` and `bun run <script>`
preload = ["./lib/proto-polyfill.ts"]

[test]
# Preload the proto polyfill before running tests to fix tronweb protobuf issues
preload = ["./lib/proto-polyfill.ts"]

[install]
# Supply-chain hardening: install only versions published at least 5 days ago,
# save exact versions with `bun add`, and never auto-install missing packages
# at runtime (that would fetch the latest versions).
minimumReleaseAge = 432000
exact = true
auto = "disable"
